<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vela CRM — открытая CRM для малого и среднего бизнеса: сделки, задачи, проекты, финансы и обмен с 1С." />
    <meta name="theme-color" content="#0B1A2A" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Vela CRM</title>
    <script>
      try {
        var t = localStorage.getItem('vela-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
